{% load static %}
{% load account %}
{% load nav %}
{% load icons %}
<div class="wrap">
  <div class="cols">
    <div class="span-auto md-span-3">
      <a href="{% url 'weallcode-home' %}">
        <img class="main-logo" src="{% static 'weallcode/images/logo/logo-horizontal-combo.svg' %}" alt="Navigate Home">
      </a>
    </div>
    <nav class="header-nav span-shrink md-span-9" aria-label="Main">
      <button class="mobile-nav-trigger" type="button" popovertarget="site-nav" aria-controls="site-nav">{% icon "bars" label="Menu" %}</button>
      <ul id="site-nav" class="main-menu" popover>
        <li><a{% nav_current 'weallcode-our-story' %} href="{% url 'weallcode-our-story' %}">Our Story</a></li>
        <li><a{% nav_current 'weallcode-programs' %} href="{% url 'weallcode-programs' %}">Programs</a></li>
        <li><a{% nav_current 'weallcode-team' %} href="{% url 'weallcode-team' %}">Team</a></li>
        <li><a{% nav_current 'weallcode-join-us' %} href="{% url 'weallcode-join-us' %}">Join Us</a></li>
        <li class="main-menu-donate"><a class="cta cta-tertiary" href="javascript:donsPlus.openWidget();">Donate</a></li>
        {% if user.is_authenticated %}
          <li><a class="cta" href="{% url 'account_home' %}">Account</a></li>
        {% else %}
          <li><a class="cta" href="{% url 'account_login' %}">Log In</a></li>
        {% endif %}
      </ul>
    </nav>
  </div>
</div>
