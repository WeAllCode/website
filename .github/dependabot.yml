# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Paused (open-pull-requests-limit: 0) for the 2026-11 dependency upgrade window, so nothing
# auto-merges mid-upgrade (docs/plans/dependency-upgrades-2026-11.md, R4). Checkpoint 2C
# turns it back on with the "uv" ecosystem after the last checkpoint.

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Maintain dependencies for Python
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
