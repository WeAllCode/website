# Installed to /etc/postgresql/17/main/conf.d/wac.conf. Sized for an e2-micro (1 GB RAM)
# shared with two gunicorn services and Caddy. shared_buffers and listen_addresses need a restart.
listen_addresses = ''
max_connections = 20
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB
