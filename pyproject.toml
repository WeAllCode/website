[project]
name = "we-all-code"
description = "Django web application for We All Code nonprofit coding education organization"
version = "0.0.1"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Ali Karbassi", email = "ali@weallcode.org"}]
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core Framework
    "django>=5.2.19,<6.0",

    # Database & Storage
    "psycopg[binary]>=3.3.9,<4.0.0",
    "dj-database-url>=3.1.2,<4.0",
    "django-storages[google]>=1.14,<2.0",

    # Authentication & Security
    "django-allauth[socialaccount]>=65.22.1,<66.0.0",
    "django-recaptcha>=4.1.0,<5.0.0",
    "django-loginas>=0.3.14,<0.4.0",

    # Email & Communications
    "django-anymail[resend]>=15.3,<16",

    # UI & Templates
    "django-bootstrap3>=26.3,<27.0",
    "django-active-link>=0.3.0,<0.4.0",
    "django-meta>=2.5.1,<3.0.0",

    # Image Processing
    "pillow>=13.0,<14.0.0",
    "django-stdimage>=6.0.2,<7.0.0",
    "django-cleanup>=9.0.0,<10.0.0",

    # Utilities & Helpers
    "arrow>=1.4.0,<2.0.0",
    "icalendar>=7.3.2,<8",
    "django-appconf>=1.2.0,<2.0.0",
    "python-dateutil>=4.0,<5",
    "requests>=2.33.0,<3",

    # Admin & Data Management
    "django-import-export>=4.4.6,<5.0.0",

    # Background Tasks

    # Environment & Configuration
    "django-environ>=0.14.0,<0.15.0",

    # Production Server
    "gunicorn>=23.0.0,<27.0.0",

    # Monitoring & Logging
    "sentry-sdk>=2.35.0,<3.0.0",

    # Task Management (Heroku Procfile release phase runs `invoke release`;
    # move to dev once Procfile/app.json/tasks.py release are removed)
    "invoke>=3.0.3,<4",
]

[project.urls]
Repository = "https://github.com/weallcode/website"
Homepage = "https://github.com/weallcode/website"

[tool.ruff]
# Use Ruff's recommended defaults
target-version = "py311"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "COM812", # Trailing comma missing - conflicts with formatter
  "DJ001", # null=True on CharField/TextField - changing it needs data migrations
  "E501", # line length is owned by `ruff format`; leftovers are long strings
  "EM101", # string literal in exception - style
  "EM102", # f-string in exception - style
  "ERA001", # commented-out code - kept on purpose as notes in several files
  "N806", # uppercase locals used as constants inside functions
  "PLC0415", # imports inside functions avoid circular model imports
  "PLR2004", # magic value comparison - style
  "PTH", # os.path -> pathlib - refactor out of scope
  "RET504", # unnecessary assignment before return - style
  "RUF059", # unused `created` from get_or_create - style
  "SIM103", # return condition directly - style
  "SIM108", # ternary instead of if/else - style
  "SIM201", # `not a == b` vs `a != b` - style
  "SIM210", # bool(...) instead of True if ... else False - style
  "TID252", # relative imports - style
  "TRY003", # long messages outside exception class - style
  "A002", # templatetag filter arg named `str`
  "C901", # complexity - refactor out of scope
  "PLR0913", # too many arguments - refactor out of scope
  "PLR0917", # too many positional arguments - refactor out of scope
  "RUF005", # iterable unpacking instead of concatenation - style
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"] # star imports re-export package modules
"coderdojochi/old_views.py" = [ # legacy views, slated for removal
  "C400",
  "C414",
  "FBT002",
  "PERF401",
  "PLR0912",
  "RUF046",
]
"coderdojochi/custom_storages.py" = ["B026"] # dead code, referenced nowhere
"coderdojochi/util.py" = ["B006"] # email() defaults are never mutated
"manage.py" = ["EXE001"] # run via `python manage.py`; no mode change
"tasks.py" = ["B008", "PT028"] # invoke tasks: env defaults are intended; not pytest

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6,<0.18",
    "factory-boy>=3.3.3,<4.0.0",
    "django-debug-toolbar>=8.0.0,<9",
]
